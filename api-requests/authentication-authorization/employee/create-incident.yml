info:
  name: Create Incident
  type: http
  seq: 3

http:
  method: POST
  url: "{{mcpUrl}}"
  headers:
    - name: Authorization
      value: Bearer {{employeeJwt}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/call",
        "params": {
          "name": "create_incident",
          "arguments": {
            "body": {
              "title": "MCP Employee Authorization Test",
              "description": "Incident created to validate MCP ABAC permissions for the Employee persona.",
              "priority": "LOW",
              "category": "SOFTWARE",
              "reportedBy": {
                "name": "Jane Smith",
                "email": "jane.smith@brilliant-mule.com",
                "phone": "425-555-0199"
              }
            }
          }
        }
      }

runtime:
  scripts:
    - type: after-response
      code: |-
        const response = res.getBody();
        const incident = JSON.parse(response.result.content[0].text);

        bru.setVar('incidentId', incident.id);

        console.log('Created incident:', incident.id);
    - type: tests
      code: |-
        const response = res.getBody();

        test('Employee can create incidents', function () {
          expect(res.getStatus()).to.equal(201);
          expect(response.error).to.be.undefined;
          expect(response.result.isError).to.equal(false);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
