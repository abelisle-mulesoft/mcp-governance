info:
  name: Expired JWT
  type: http
  seq: 3

http:
  method: POST
  url: "{{mcpUrl}}"
  headers:
    - name: Authorization
      value: Bearer {{employeeExpiredJwt}}
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json, text/event-stream
  body:
    type: json
    data: |-
      {
        "jsonrpc": "2.0",
        "id": 1,
        "method": "tools/list",
        "params": {}
      }

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
